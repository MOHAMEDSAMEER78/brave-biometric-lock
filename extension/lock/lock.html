<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Locked</title>
    <link rel="stylesheet" href="lock.css">
</head>

<body>
    <div class="lock-screen">
        <div class="bg-gradient"></div>
        <div class="lock-card">
            <div class="glow-orb"></div>

            <div id="fingerprint-icon" class="fingerprint-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" />
                    <path d="M14 13.12c0 2.38 0 6.38-1 8.88" />
                    <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" />
                    <path d="M2 12a10 10 0 0 1 18-6" />
                    <path d="M2 16h.01" />
                    <path d="M21.8 16c.2-2 .131-5.354 0-6" />
                    <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2" />
                    <path d="M8.65 22c.21-.66.45-1.32.57-2" />
                    <path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2" />
                </svg>
            </div>

            <h1 class="title">Browser Locked</h1>

            <button id="unlock-btn" class="unlock-btn">
                <span class="btn-fingerprint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" width="20" height="20">
                        <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" />
                        <path d="M14 13.12c0 2.38 0 6.38-1 8.88" />
                        <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" />
                    </svg>
                </span>
                Unlock with Touch ID
            </button>

            <p id="status" class="status"></p>

            <button id="password-toggle" class="text-btn">Use password instead</button>

            <div id="password-section" class="password-section">
                <div class="input-row">
                    <input type="password" id="password-input" class="password-input"
                        placeholder="Enter fallback password" autocomplete="off">
                    <button id="password-submit" class="submit-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <p class="footer">Brave Biometric Lock v1.0</p>
    </div>

    <script src="../biometric.js"></script>
    <script src="lock.js"></script>
</body>

</html>
